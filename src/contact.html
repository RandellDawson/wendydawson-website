<!DOCTYPE html>

<html lang="en">
<head>
<title>Contact Wendy Dawson</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="css/style.css" media="screen" rel="stylesheet" type="text/css"/>
<link href="/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
<link href="/favicon.ico" rel="icon" type="image/x-icon"/>
</head>
<body>
<div class="bg">
<section id="content">
<div class="interior-banner"><div class="interior-banner-inner"><span class="interior-eyebrow">WENDY DAWSON</span><h1>Contact Wendy</h1><p>Start a conversation about partnerships, opportunities, and ideas.</p></div></div><div class="main interior-main">
<div class="container_12">
<div class="wrapper">
<div class="grid_6">

<form action="/contact" method="POST" class="interior-form" id="contact-form" name="wendy-contact" data-netlify="true" netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="wendy-contact"/>
<p hidden><label>Do not fill this out: <input name="bot-field"/></label></p>
<div class="success" role="status" aria-live="polite">
                  Contact form submitted!<br/>
<strong>I will be in touch soon.</strong>
</div>
<div class="failure" role="alert">
                  Form submission error!<br/>
<strong>Please try again.</strong>
</div>
<fieldset>
<div class="wrapper">
<span class="col1">Name:</span>
<label class="name">
<span class="bg"><input class="input form-field" name="name" type="text" required value=""/></span><span class="error"></span>
</label>
</div>
<div class="wrapper">
<span class="col1">Email:</span>
<label class="email">
<span class="bg"><input class="input form-field" name="email" type="email" required value=""/></span><span class="error"></span>
</label>
</div>
<div class="wrapper">
<span class="col1">Phone:</span>
<label class="phone" notrequired="">
<span class="bg"><input class="input form-field" name="phone" type="text" value=""/></span><span class="error"></span>
</label>
</div>
<div class="wrapper">
<span class="col1">Message:</span>
<label class="message">
<span class="bg"><textarea class="form-field" cols="50" name="message" rows="5" required value=""></textarea></span><br/><br/><span class="error"></span>
</label>
</div>
<div class="buttons"><button class="link button-submit" type="submit">Send</button> <button class="link button-reset" type="reset">Clear</button></div>
</fieldset>
</form>
</div>
<div class="grid_6">
<figure class="img-indent-bot"><img alt="" class="border" src="images/contact.jpg"/></figure>
</div>
</div>
</div>
</div>
</section>
</div>
<script src="/index.js" type="module"></script>



</body>
</html>
